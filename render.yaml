services:
  - type: web
    name: eightfold-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you set the value manually in Render dashboard
    healthCheckPath: /docs
